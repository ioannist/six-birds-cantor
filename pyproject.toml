[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual_cantor"
version = "0.0.1"
description = "Minimal scaffold for contextual cantor experiments"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5", "mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
